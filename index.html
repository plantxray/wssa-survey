<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invasive Plant Community Survey</title>
<meta name="description" content="WSSA Invasive Plant Committee survey of researchers, educators, students and land managers working on invasive plants.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one reading column (46rem) under a white letterhead band carrying the WSSA logo; a sticky step rail tracks the sections; one section per screen. */
:root{
  --brand:#4A7A49;        /* WSSA logo green (fixed: the letterhead stays white in both themes) */
  --brand-dark:#2C4C2D;   /* WSSA logo wordmark green */
  --mast-bg:#FFFFFF;
  --accent:#4A7A49;
  --accent-strong:#2E5530;
  --on-accent:#FFFFFF;
  --done:#9DBB97;
  --ink:#1B2A1E;
  --muted:#56655A;
  --bg:#F4F7F3;
  --surface:#FFFFFF;
  --line:#D5DFD3;
  --tint:#E7F0E5;
  --sage:#2E5530;
  --wheat:#9A7417;
  --danger:#B3261E;
  --font-display:'Newsreader', Georgia, 'Times New Roman', serif;
  --font-body:'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --radius:8px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --accent:#8FC489; --accent-strong:#ABD7A5; --on-accent:#0F1F0E; --done:#4F7A4B;
    --ink:#E2ECE1; --muted:#A1B2A2; --bg:#0F1510; --surface:#172019; --line:#2C3B2E; --tint:#1F3A22;
    --sage:#ABD7A5; --wheat:#DDB45A; --danger:#F28B82; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --accent:#8FC489; --accent-strong:#ABD7A5; --on-accent:#0F1F0E; --done:#4F7A4B;
  --ink:#E2ECE1; --muted:#A1B2A2; --bg:#0F1510; --surface:#172019; --line:#2C3B2E; --tint:#1F3A22;
  --sage:#ABD7A5; --wheat:#DDB45A; --danger:#F28B82; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font-body);min-height:100vh;display:flex;flex-direction:column}
img{max-width:100%}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent-strong)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Masthead: white letterhead with the WSSA logo */
.mast{background:var(--mast-bg);border-bottom:3px solid var(--brand);padding-top:env(safe-area-inset-top,0px)}
.mast-inner{max-width:46rem;margin:0 auto;padding:.85rem 1rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem 1.5rem}
.logo{display:block;height:72px;width:auto;max-width:100%}
.committee{font:600 .76rem/1.2 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--brand-dark)}
@media (max-width:520px){.logo{height:52px}.mast-inner{padding-block:.7rem}}
.preview-strip{background:var(--tint);color:var(--ink);font-size:.82rem;text-align:center;padding:.45rem 1rem;border-bottom:1px solid var(--line)}
.preview-strip b{font-family:var(--font-mono);font-weight:500;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-strong);margin-right:.4rem}

/* Step rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.rail-inner{max-width:46rem;margin:0 auto;padding:.6rem 1rem .55rem}
.rail-steps{display:flex;gap:.35rem;list-style:none;margin:0;padding:0}
.rail-steps li{flex:1;min-width:0}
.rail-steps .bar{height:4px;border-radius:2px;background:var(--line)}
.rail-steps li.done .bar{background:var(--done)}
.rail-steps li.current .bar{background:var(--accent)}
.rail-steps .lbl{display:block;font-size:.72rem;color:var(--muted);margin-top:.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-steps li.current .lbl{color:var(--ink);font-weight:600}
.rail-steps li.skipped .lbl{text-decoration:line-through;opacity:.6}
.rail-mobile{display:none;font-size:.8rem;color:var(--muted);margin-top:.35rem}
@media (max-width:640px){.rail-steps .lbl{display:none}.rail-mobile{display:block}}

/* Main */
.wrap{flex:1;width:100%;max-width:46rem;margin:0 auto;padding-inline:1rem;padding-block:2rem 3rem}
.eyebrow{font:500 .74rem/1.2 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent-strong);margin:0 0 .6rem}
h1,h2{font-family:var(--font-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.005em}
h1{font-size:clamp(2rem,5.5vw,2.8rem);line-height:1.08}
h2{font-size:clamp(1.55rem,4vw,2rem);line-height:1.15}
.lede{font-size:1.08rem;color:var(--ink);max-width:62ch;margin:1rem 0 0}
.section-intro{color:var(--muted);margin:.5rem 0 0;max-width:62ch}

/* Herbarium-style survey label */
.label-card{margin:1.75rem 0 0;border:1.5px solid var(--ink);border-radius:2px;background:var(--surface);max-width:34rem;font-size:.9rem}
.label-card .lc-head{display:flex;justify-content:space-between;gap:1rem;border-bottom:1px solid var(--ink);padding:.45rem .8rem;font:500 .7rem/1.3 var(--font-mono);letter-spacing:.1em;text-transform:uppercase}
.label-card dl{margin:0;padding:.35rem .8rem .55rem;display:grid;grid-template-columns:auto minmax(0,1fr);gap:.3rem 1rem}
.label-card dt{font:500 .72rem/1.6 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:.1rem}
.label-card dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:460px){.label-card dl{grid-template-columns:1fr;gap:0}.label-card dd{margin-bottom:.45rem}}

.consent{display:flex;gap:.75rem;align-items:flex-start;margin:1.75rem 0 0;padding:1rem;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);max-width:40rem;cursor:pointer}
.consent input{width:20px;height:20px;margin:.15rem 0 0;accent-color:var(--accent);flex:none}
.notice{margin:1.5rem 0 0;padding:.85rem 1rem;border-radius:var(--radius);background:var(--tint);display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;font-size:.92rem}
.notice p{margin:0;flex:1 1 16rem}

/* Buttons */
.actions{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;margin-top:2rem}
.btn{appearance:none;border:1px solid transparent;border-radius:999px;padding:.72rem 1.4rem;font-weight:600;font-size:.98rem;cursor:pointer;line-height:1.2;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-strong)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--accent)}
.btn-link{background:none;border:none;padding:.4rem .2rem;color:var(--accent-strong);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.actions .spacer{flex:1}
.step-count{font:500 .75rem var(--font-mono);color:var(--muted);letter-spacing:.06em}

/* Questions */
.qlist{display:flex;flex-direction:column;gap:2.25rem;margin-top:2rem}
.q{border:0;margin:0;padding:0;min-width:0}
.qhead{display:flex;gap:.7rem;align-items:baseline}
.qnum{font:500 .78rem/1 var(--font-mono);color:var(--accent-strong);flex:none;min-width:2.4rem}
.qtext{font-size:1.06rem;font-weight:600;line-height:1.4;margin:0;text-wrap:pretty}
.req{display:inline-block;margin-left:.4rem;font:500 .66rem/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--wheat);vertical-align:.15em}
.qbody{padding-left:3.1rem;margin-top:.35rem}
@media (max-width:560px){.qbody{padding-left:0}}
.help{color:var(--muted);font-size:.9rem;margin:0 0 .75rem}
.cond{display:inline-block;font:500 .7rem/1.4 var(--font-mono);color:var(--sage);border:1px solid color-mix(in srgb,var(--sage) 45%,transparent);border-radius:4px;padding:.15rem .45rem;margin:0 0 .7rem}
.counter{font:500 .72rem var(--font-mono);color:var(--muted);margin:.55rem 0 0}
.err{color:var(--danger);font-size:.88rem;font-weight:600;margin:.6rem 0 0}
.q.invalid .opts .opt{border-color:color-mix(in srgb,var(--danger) 55%,var(--line))}

.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,16.5rem),1fr));gap:.5rem}
.opt{position:relative;display:flex;gap:.7rem;align-items:flex-start;padding:.68rem .85rem;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);cursor:pointer;min-width:0;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.mark{flex:none;width:18px;height:18px;margin-top:.15rem;border:1.5px solid var(--muted);border-radius:4px;background:var(--surface);position:relative;transition:background .12s,border-color .12s}
.opt.radio .mark{border-radius:50%}
.opt-text{min-width:0;font-size:.95rem;line-height:1.35}
.opt-text small{display:block;color:var(--muted);font-size:.82rem;margin-top:.15rem}
.opt:has(input:checked){border-color:var(--accent);background:var(--tint)}
.opt:has(input:checked) .mark{border-color:var(--accent);background:var(--accent)}
.opt.check:has(input:checked) .mark::after{content:"";position:absolute;left:5px;top:1.5px;width:5px;height:9px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg)}
.opt.radio:has(input:checked) .mark{box-shadow:inset 0 0 0 3px var(--surface)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.opt:has(input:disabled){opacity:.45;cursor:not-allowed}
.opt:has(input:disabled):hover{border-color:var(--line)}
.other-input{margin-top:.5rem}

.field{width:100%;border:1px solid var(--line);border-radius:6px;padding:.65rem .8rem;background:var(--surface);font-size:1rem;line-height:1.4}
.field:focus{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent);outline-offset:0}
textarea.field{min-height:6.5rem;resize:vertical}
.text-q .field{max-width:28rem}
.text-q textarea.field{max-width:none}

/* Matrix */
.matrix{border-top:1px solid var(--line)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem 1rem;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--line)}
.mlabel{font-size:.95rem;min-width:0}
.mopts{display:flex;flex-wrap:wrap;gap:.3rem}
.pill{position:relative;cursor:pointer}
.pill input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.pill span{display:block;padding:.38rem .7rem;border:1px solid var(--line);border-radius:999px;font-size:.84rem;background:var(--surface);white-space:nowrap;transition:background .12s,border-color .12s}
.pill:hover span{border-color:var(--accent)}
.pill input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.pill input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:720px){.mrow{grid-template-columns:minmax(0,1fr)}.mopts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.25rem}.pill span{text-align:center;padding:.45rem .2rem;font-size:.8rem;border-radius:6px}}

/* Review-all view */
.review-section{margin-top:3rem;padding-top:1.5rem;border-top:2px solid var(--ink)}
.review-section:first-of-type{margin-top:2rem}
.review .opt,.review .pill{cursor:default}
.review .opt:hover{border-color:var(--line)}
.review .opt:has(input:disabled){opacity:1}
.review-meta{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;margin-top:1rem;font-size:.9rem;color:var(--muted)}
.review-meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.dyn-note{font-size:.9rem;color:var(--muted);font-style:italic;margin:0}

/* Thanks */
.thanks-mark{width:56px;height:56px;border-radius:50%;background:var(--accent);display:grid;place-items:center;margin-bottom:1.25rem}
.thanks-mark svg{width:28px;height:28px;color:var(--on-accent)}
.preview-data{margin-top:2rem;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.preview-data summary{cursor:pointer;padding:.8rem 1rem;font-weight:600}
.preview-data .tbl-wrap{overflow-x:auto;border-top:1px solid var(--line)}
.preview-data table{border-collapse:collapse;width:100%;font-size:.82rem}
.preview-data td,.preview-data th{padding:.35rem .9rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.preview-data th{font:500 .74rem var(--font-mono);color:var(--muted);white-space:nowrap}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

footer{border-top:1px solid var(--line);padding-inline:1rem;padding-block:1.25rem calc(1.25rem + env(safe-area-inset-bottom,0px))}
.foot-inner{max-width:46rem;margin:0 auto;display:flex;flex-wrap:wrap;gap:.4rem 1.5rem;justify-content:space-between;font-size:.8rem;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

/* Active sections, numbered automatically: 1.1, 1.2 … follow-ups get a letter (2.1a).
   {question_id} in a showIfText is replaced with that question's number. */
const SURVEY = SURVEY_ALL.filter(s => s.enabled !== false);
(function numberQuestions(){
  const nums = {};
  SURVEY.forEach((s, si) => {
    let n = 0, sub = 0;
    s.questions.forEach(q => {
      if (q.followUp){ sub++; q.num = (si + 1) + "." + n + String.fromCharCode(96 + sub); }
      else { n++; sub = 0; q.num = (si + 1) + "." + n; }
      nums[q.id] = q.num;
    });
  });
  const fill = t => t && t.replace(/\{(\w+)\}/g, (m, id) => nums[id] || id);
  SURVEY.forEach(s => { s.showIfText = fill(s.showIfText); s.questions.forEach(q => { q.showIfText = fill(q.showIfText); }); });
})();

<script>
(function(){
"use strict";
const DRAFT_KEY = "wssa-ipc-survey-draft-v1";
const app = document.getElementById("app");
const state = { answers:{}, view:"intro", step:0, started:null, hasDraft:false, lastRow:null };

/* ---------- helpers ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const opt = o => ({ v:o[0], t:o[1], ex:o[2] || null, other:!!(o[3] && o[3].other), exclusive:!!(o[3] && o[3].exclusive) });
const allQuestions = () => SURVEY.flatMap(s => s.questions.map(q => Object.assign({ section:s }, q)));
const findQ = id => allQuestions().find(q => q.id === id);
const sectionOn = s => !s.showIf || s.showIf(state.answers);
const qOn = q => !q.showIf || q.showIf(state.answers);
const visibleSections = () => SURVEY.filter(sectionOn);
const reduceMotion = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function optionsFor(q){
  if (q.dynamicFrom){
    const src = findQ(q.dynamicFrom);
    const picked = state.answers[q.dynamicFrom] || [];
    return src.options.map(opt).filter(o => picked.includes(o.v) && !o.exclusive).map(o => {
      if (o.other){
        const txt = (state.answers[q.dynamicFrom + "_other"] || "").trim();
        return { v:o.v, t: txt ? "Other: " + txt : "Other", ex:null };
      }
      return { v:o.v, t:o.t, ex:o.ex };
    });
  }
  return (q.options || []).map(opt);
}

function saveDraft(){
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ answers:state.answers, step:state.step, started:state.started })); } catch(e){}
}
function loadDraft(){
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
    if (d && d.answers && Object.keys(d.answers).length){ return d; }
  } catch(e){}
  return null;
}
function clearDraft(){ try { localStorage.removeItem(DRAFT_KEY); } catch(e){} }

/* ---------- rendering ---------- */
function render(){
  const rail = document.getElementById("rail");
  rail.hidden = !(state.view === "section");
  if (state.view === "intro") renderIntro();
  else if (state.view === "section") renderSection();
  else if (state.view === "review") renderReview();
  else if (state.view === "thanks") renderThanks();
}

function labelCard(){
  const contact = SETTINGS.contactEmail ? `${esc(SETTINGS.contactName)} · <span>${esc(SETTINGS.contactEmail)}</span>` : esc(SETTINGS.contactName);
  return `<div class="label-card" role="group" aria-label="Survey details">
    <div class="lc-head"><span>Survey details</span><span>2026–27</span></div>
    <dl>
      <dt>Conducted by</dt><dd>WSSA Invasive Plant Committee</dd>
      <dt>For</dt><dd>Researchers, extension educators, students, land managers and anyone else who works on invasive plants. WSSA membership not required.</dd>
      <dt>Time</dt><dd>About 8 minutes</dd>
      <dt>Responses</dt><dd>Anonymous. If you choose to leave an email address, it is kept in a separate list.</dd>
      <dt>Questions</dt><dd>${contact}</dd>
    </dl>
  </div>`;
}

function renderIntro(){
  const draft = state.hasDraft;
  app.innerHTML = `
    <p class="eyebrow">WSSA Invasive Plant Committee</p>
    <h1>Invasive Plant Community Survey</h1>
    <p class="lede">Who studies and manages invasive plants today, how is that work funded, and where do people turn for answers? Your responses will guide the WSSA Invasive Plant Committee's symposia, meeting sessions and priorities.</p>
    ${labelCard()}
    ${draft ? `<div class="notice" role="status"><p>You have an unfinished response on this device.</p><button class="btn btn-primary" type="button" data-act="resume">Continue where I left off</button><button class="btn-link" type="button" data-act="discard">Start over</button></div>` : ""}
    <label class="consent" for="consent">
      <input type="checkbox" id="consent">
      <span>I understand that taking part is voluntary, that I can skip any question not marked required, and that results will be reported only in summary form.</span>
    </label>
    <div class="actions">
      <button class="btn btn-primary" type="button" id="startBtn" data-act="start" disabled>Start the survey</button>
      <button class="btn-link" type="button" data-act="review">See all questions</button>
    </div>`;
  const c = document.getElementById("consent");
  const b = document.getElementById("startBtn");
  c.addEventListener("change", () => { b.disabled = !c.checked; });
}

function renderRail(){
  const vis = visibleSections();
  const curId = vis[state.step] && vis[state.step].id;
  const curIdx = SURVEY.findIndex(s => s.id === curId);
  document.getElementById("railSteps").innerHTML = SURVEY.map((s, i) => {
    const on = sectionOn(s);
    let cls = !on ? "skipped" : (s.id === curId ? "current" : (i < curIdx ? "done" : ""));
    return `<li class="${cls}"${s.id === curId ? ' aria-current="step"' : ""}><div class="bar"></div><span class="lbl">${esc(s.title)}</span></li>`;
  }).join("");
  document.getElementById("railMobile").textContent = `Section ${state.step + 1} of ${vis.length} · ${vis[state.step].title}`;
}

function renderQuestion(q, opts){
  const review = !!(opts && opts.review);
  const dis = review ? " disabled" : "";
  const a = state.answers;
  const hidden = !review && !qOn(q) ? " hidden" : "";
  const cond = review && q.showIf ? `<p class="cond">${esc(q.showIfText || "Conditional")}</p>` : "";
  const req = q.required ? `<span class="req">Required</span>` : "";
  const help = q.help ? `<p class="help" id="h-${q.id}">${esc(q.help)}</p>` : "";
  let body = "";

  if (q.type === "single" || q.type === "multi"){
    const multi = q.type === "multi";
    const list = optionsFor(q);
    if (q.dynamicFrom && review){
      body = `<p class="dyn-note">Lists the sources the person chose in ${esc(findQ(q.dynamicFrom).num)}, so they can pick one.</p>`;
    } else {
      const cur = a[q.id];
      body = `<div class="opts" role="${multi ? "group" : "radiogroup"}" aria-labelledby="qt-${q.id}">` + list.map(o => {
        const checked = multi ? (Array.isArray(cur) && cur.includes(o.v)) : cur === o.v;
        const id = `o-${q.id}-${o.v}`;
        return `<label class="opt ${multi ? "check" : "radio"}" for="${id}">
          <input type="${multi ? "checkbox" : "radio"}" id="${id}" name="${q.id}" value="${esc(o.v)}"${checked && !review ? " checked" : ""}${dis}>
          <span class="mark" aria-hidden="true"></span>
          <span class="opt-text">${esc(o.t)}${o.ex ? `<small>${esc(o.ex)}</small>` : ""}</span>
        </label>`;
      }).join("") + `</div>`;
      if (list.some(o => o.other)){
        const showOther = !review && (multi ? (a[q.id] || []).includes("other") : a[q.id] === "other");
        body += `<input class="field other-input" type="text" id="${q.id}_other" data-other-for="${q.id}" aria-label="Other (please specify)" placeholder="Please specify" value="${esc(a[q.id + "_other"] || "")}"${showOther ? "" : " hidden"}${dis}>`;
      }
      if (q.max) body += `<p class="counter" id="c-${q.id}">${review ? `Up to ${q.max}` : `${(a[q.id] || []).length} of ${q.max} chosen`}</p>`;
    }
  } else if (q.type === "matrix"){
    const cur = a[q.id] || {};
    body = `<div class="matrix">` + q.rows.map(r => {
      const nm = `${q.id}__${r[0]}`;
      return `<div class="mrow"><div class="mlabel" id="ml-${nm}">${esc(r[1])}</div>
        <div class="mopts" role="radiogroup" aria-labelledby="ml-${nm}">` + q.cols.map(c => {
          const id = `o-${nm}-${c[0]}`;
          return `<label class="pill" for="${id}"><input type="radio" id="${id}" name="${nm}" value="${esc(c[0])}" data-matrix="${q.id}" data-row="${esc(r[0])}"${cur[r[0]] === c[0] && !review ? " checked" : ""}${dis}><span>${esc(c[1])}</span></label>`;
        }).join("") + `</div></div>`;
    }).join("") + `</div>`;
  } else if (q.type === "textarea"){
    body = `<textarea class="field" id="f-${q.id}" name="${q.id}" aria-labelledby="qt-${q.id}" placeholder="Optional"${dis}>${review ? "" : esc(a[q.id] || "")}</textarea>`;
  } else {
    const t = q.type === "email" ? "email" : "text";
    const list = q.list ? ` list="${q.list}"` : "";
    const ac = q.type === "email" ? ' autocomplete="email"' : ' autocomplete="off"';
    body = `<input class="field" type="${t}" id="f-${q.id}" name="${q.id}"${list}${ac} aria-labelledby="qt-${q.id}" placeholder="${esc(q.placeholder || "")}" value="${review ? "" : esc(a[q.id] || "")}"${dis}>`;
  }

  const textish = ["text","email","textarea"].includes(q.type) ? " text-q" : "";
  return `<div class="q${textish}" id="q-${q.id}" data-q="${q.id}"${hidden}>
    <div class="qhead"><span class="qnum">${esc(q.num)}</span><h3 class="qtext" id="qt-${q.id}">${esc(q.label)}${req}</h3></div>
    <div class="qbody">${cond}${help}${body}<p class="err" id="e-${q.id}" role="alert" hidden></p></div>
  </div>`;
}

function renderSection(){
  const vis = visibleSections();
  if (state.step >= vis.length) state.step = vis.length - 1;
  const s = vis[state.step];
  const last = state.step === vis.length - 1;
  renderRail();
  app.innerHTML = `
    <p class="eyebrow">Section ${state.step + 1} of ${vis.length}</p>
    <h2>${esc(s.title)}</h2>
    <p class="section-intro">${esc(s.intro)}</p>
    <form id="secForm" novalidate>
      <div class="qlist">${s.questions.map(q => renderQuestion(q)).join("")}</div>
      ${last ? `<div class="hp" aria-hidden="true"><label for="hpField">Leave this empty</label><input type="text" id="hpField" tabindex="-1" autocomplete="off"></div>` : ""}
      <div class="actions">
        <button class="btn btn-ghost" type="button" data-act="back">Back</button>
        <span class="spacer"></span>
        <button class="btn btn-primary" type="submit" id="nextBtn">${last ? "Submit response" : "Next section"}</button>
      </div>
      <p class="err" id="submitErr" role="alert" hidden></p>
    </form>`;
  s.questions.forEach(q => updateLimits(q.id));
  document.getElementById("secForm").addEventListener("submit", e => { e.preventDefault(); next(); });
  const dl = document.getElementById("places");
  if (!dl){
    const d = document.createElement("datalist"); d.id = "places";
    d.innerHTML = PLACES.map(p => `<option value="${esc(p)}"></option>`).join("");
    document.body.appendChild(d);
  }
}

function renderReview(){
  const all = allQuestions();
  const conditional = all.filter(q => q.showIf || q.section.showIf).length;

    <h1>Invasive Plant Community Survey</h1>
    <p class="lede">Every question in the survey, including ones people only see based on earlier answers. Conditional questions are tagged.</p>
    <div class="review-meta"><span><b>${all.length}</b> questions</span><span><b>${SURVEY.length}</b> sections</span><span><b>${conditional}</b> conditional</span><span><b>${all.filter(q=>q.required).length}</b> required</span></div>
    <div class="actions"><button class="btn btn-ghost" type="button" data-act="home">Back to start</button></div>
    <div class="review">` + SURVEY.map((s, i) => `
      <section class="review-section">

        <p class="section-intro">${esc(s.intro)}</p>
        ${s.showIf ? `<p class="cond" style="margin-top:.75rem">${esc(s.showIfText)}</p>` : ""}
        <div class="qlist">${s.questions.map(q => renderQuestion(q, { review:true })).join("")}</div>
      </section>`).join("") + `</div>
    <div class="actions"><button class="btn btn-ghost" type="button" data-act="home">Back to start</button></div>`;
}

function renderThanks(){
  const preview = !SETTINGS.submitUrl;
  const row = state.lastRow;
  const rows = row ? Object.keys(row.row).map(k => `<tr><th>${esc(k)}</th><td>${esc(row.row[k])}</td></tr>`).join("") : "";
  const contactRows = row && row.contact ? Object.keys(row.contact).map(k => `<tr><th>${esc(k)}</th><td>${esc(row.contact[k])}</td></tr>`).join("") : "";
  app.innerHTML = `
    <div class="thanks-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <p class="eyebrow">${preview ? "Preview complete" : "Response recorded"}</p>
    <h1>Thank you</h1>
    <p class="lede">${preview
      ? "This was a preview, so nothing was saved. Below is exactly what would be written to the response sheet."
      : "Your answers have been sent to the WSSA Invasive Plant Committee. A summary of results will be shared with WSSA members and anyone who asked to receive it."}</p>
    <div class="actions"><button class="btn btn-ghost" type="button" data-act="restart">Start a new response</button></div>
    ${preview && row ? `<details class="preview-data" open><summary>Response sheet row</summary><div class="tbl-wrap"><table>${rows}</table></div></details>
      ${contactRows ? `<details class="preview-data"><summary>Contacts sheet row (stored separately)</summary><div class="tbl-wrap"><table>${contactRows}</table></div></details>` : ""}` : ""}`;
}

/* ---------- interaction ---------- */
function updateLimits(qid){
  const q = findQ(qid); if (!q) return;
  const box = document.getElementById("q-" + qid); if (!box) return;
  if (q.type === "multi" && q.max){
    const chosen = (state.answers[qid] || []);
    box.querySelectorAll('input[type="checkbox"]').forEach(inp => {
      inp.disabled = !inp.checked && chosen.length >= q.max;
    });
    const c = document.getElementById("c-" + qid);
    if (c) c.textContent = `${chosen.length} of ${q.max} chosen`;
  }
  const other = document.getElementById(qid + "_other");
  if (other){
    const v = state.answers[qid];
    other.hidden = !(Array.isArray(v) ? v.includes("other") : v === "other");
  }
}

function refreshSection(changedId){
  const vis = visibleSections();
  const s = vis[state.step]; if (!s) return;
  s.questions.forEach(q => {
    const el = document.getElementById("q-" + q.id); if (!el) return;
    const on = qOn(q);
    if (el.hidden === on) el.hidden = !on;
    if (q.dynamicFrom && q.dynamicFrom === changedId){
      const valid = optionsFor(q).map(o => o.v);
      if (state.answers[q.id] && !valid.includes(state.answers[q.id])) delete state.answers[q.id];
      el.outerHTML = renderQuestion(q);
    }
  });
  renderRail();
  const nb = document.getElementById("nextBtn");
  if (nb) nb.textContent = state.step === vis.length - 1 ? "Submit response" : "Next section";
}

app.addEventListener("change", e => {
  const t = e.target;
  if (state.view !== "section") return;
  if (t.dataset.matrix){
    const m = state.answers[t.dataset.matrix] || (state.answers[t.dataset.matrix] = {});
    m[t.dataset.row] = t.value;
    clearErr(t.dataset.matrix);
  } else if (t.type === "checkbox" && t.name){
    const q = findQ(t.name); if (!q) return;
    let arr = state.answers[q.id] || [];
    const o = optionsFor(q).find(x => x.v === t.value);
    if (t.checked){
      if (o && o.exclusive) arr = [t.value];
      else arr = arr.filter(v => { const oo = optionsFor(q).find(x => x.v === v); return !(oo && oo.exclusive); }).concat(t.value);
    } else arr = arr.filter(v => v !== t.value);
    state.answers[q.id] = arr;
    document.getElementById("q-" + q.id).querySelectorAll('input[type="checkbox"]').forEach(inp => { inp.checked = arr.includes(inp.value); });
    updateLimits(q.id); clearErr(q.id); refreshSection(q.id);
  } else if (t.type === "radio" && t.name){
    state.answers[t.name] = t.value;
    updateLimits(t.name); clearErr(t.name); refreshSection(t.name);
  }
  saveDraft();
});
app.addEventListener("input", e => {
  const t = e.target;
  if (state.view !== "section") return;
  if (t.dataset.otherFor){ state.answers[t.dataset.otherFor + "_other"] = t.value; }
  else if (t.name && (t.tagName === "TEXTAREA" || t.type === "text" || t.type === "email")){ state.answers[t.name] = t.value; clearErr(t.name); }
  saveDraft();
});
app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "start"){ state.answers = {}; state.started = Date.now(); state.step = 0; clearDraft(); go("section"); }
  else if (act === "resume"){ go("section"); }
  else if (act === "discard"){ clearDraft(); state.answers = {}; state.hasDraft = false; state.step = 0; renderIntro(); }
  else if (act === "review"){ go("review"); }
  else if (act === "home"){ go("intro"); }
  else if (act === "back"){ if (state.step === 0) go("intro"); else { state.step--; go("section"); } }
  else if (act === "restart"){ state.answers = {}; state.step = 0; state.started = null; state.hasDraft = false; state.lastRow = null; clearDraft(); go("intro"); }
});

function go(view){
  state.view = view;
  if (view === "intro") state.hasDraft = !!loadDraft() && Object.keys(state.answers).length > 0;
  render();
  saveDraft();
  window.scrollTo({ top:0, behavior: reduceMotion() ? "auto" : "smooth" });
  app.focus({ preventScroll:true });
}

function clearErr(qid){
  const box = document.getElementById("q-" + qid); if (!box) return;
  box.classList.remove("invalid");
  const e = document.getElementById("e-" + qid); if (e) e.hidden = true;
}

function validateSection(s){
  let first = null;
  s.questions.forEach(q => {
    if (!qOn(q)) return;
    const v = state.answers[q.id];
    let msg = "";
    if (q.required && (v == null || v === "" || (Array.isArray(v) && !v.length))) msg = q.type === "multi" ? "Choose at least one option to continue." : "Choose an option to continue.";
    if (!msg && q.type === "email" && v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim())) msg = "Enter an email address like name@example.org, or leave it blank.";
    const box = document.getElementById("q-" + q.id), e = document.getElementById("e-" + q.id);
    if (msg){ box.classList.add("invalid"); e.textContent = msg; e.hidden = false; if (!first) first = box; }
    else { box.classList.remove("invalid"); if (e) e.hidden = true; }
  });
  if (first){
    first.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block:"center" });
    const f = first.querySelector("input,textarea"); if (f) f.focus({ preventScroll:true });
    return false;
  }
  return true;
}

function next(){
  const vis = visibleSections();
  const s = vis[state.step];
  if (!validateSection(s)) return;
  if (state.step < vis.length - 1){ state.step++; go("section"); }
  else submit();
}

/* ---------- output ---------- */
function labelOf(q, v){
  if (q.type === "single" || q.type === "multi"){
    const base = q.dynamicFrom ? findQ(q.dynamicFrom) : q;
    const o = (base.options || []).map(opt).find(x => x.v === v);
    return o ? o.t : v;
  }
  return v;
}

function buildRow(){
  const a = state.answers;
  const row = {
    response_id: (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2),
    submitted_at: new Date().toISOString(),
    minutes_taken: state.started ? Math.round((Date.now() - state.started) / 6000) / 10 : "",
    source: new URLSearchParams(location.search).get("src") || "direct",
    survey_version: SETTINGS.version
  };
  const contact = {};
  SURVEY.forEach(s => {
    const sOn = sectionOn(s);
    s.questions.forEach(q => {
      const on = sOn && qOn(q);
      const v = on ? a[q.id] : undefined;
      if (q.contact){
        if (q.type === "multi") contact.interests = (v || []).map(x => labelOf(q, x)).join("; ");
        else if (v) contact.email = String(v).trim();
        return;
      }
      if (q.type === "matrix"){
        q.rows.forEach(r => {
          const c = v && v[r[0]] ? q.cols.find(cc => cc[0] === v[r[0]]) : null;
          row[`${q.id}__${r[0]}`] = c ? c[1] : "";
        });
      } else if (q.type === "multi"){
        row[q.id] = (v || []).map(x => labelOf(q, x)).join("; ");
      } else if (q.type === "single"){
        row[q.id] = v ? labelOf(q, v) : "";
      } else {
        row[q.id] = v ? String(v).trim() : "";
      }
      const base = q.dynamicFrom ? null : q;
      if (base && (base.options || []).some(o => o[3] && o[3].other)){
        const chose = Array.isArray(v) ? v.includes("other") : v === "other";
        row[q.id + "_other"] = chose ? (a[q.id + "_other"] || "").trim() : "";
      }
    });
  });
  return { row, contact: contact.email ? contact : null };
}

async function submit(){
  const btn = document.getElementById("nextBtn");
  const errEl = document.getElementById("submitErr");
  const hp = document.getElementById("hpField");
  const payload = buildRow();
  state.lastRow = payload;
  if (hp && hp.value){ finish(); return; }
  if (!SETTINGS.submitUrl){ finish(); return; }
  btn.disabled = true; btn.textContent = "Sending…"; errEl.hidden = true;
  try {
    await fetch(SETTINGS.submitUrl, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
    finish();
  } catch(err){
    btn.disabled = false; btn.textContent = "Submit response";
    errEl.textContent = "Your response couldn't be sent. Check your internet connection and select Submit again. Your answers are still here.";
    errEl.hidden = false;
  }
}
function finish(){
  clearDraft();
  state.view = "thanks"; state.hasDraft = false;
  render();
  window.scrollTo({ top:0 });
}

/* ---------- boot ---------- */
function boot(){
  document.getElementById("versionLabel").textContent = SETTINGS.version;
  document.getElementById("previewStrip").hidden = !!SETTINGS.submitUrl;
  const d = loadDraft();
  if (d){ state.answers = d.answers; state.step = d.step || 0; state.started = d.started || Date.now(); state.hasDraft = true; }
  if (location.hash === "#all") state.view = "review";
  render();
}
boot();
})();
</script>
